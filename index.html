<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matudroid 3D Telefon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace, sans-serif;
        }
        body {
            background-color: #0b0f10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1b211a;
        }
        /* Telefon Çərçivəsi */
        .phone {
            width: 320px;
            height: 650px;
            background: linear-gradient(135deg, #1b382b 0%, #0e1e17 100%);
            border-radius: 36px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 4px solid #2d4a3e;
            position: relative;
            overflow: hidden;
        }
        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #d0e7d2;
            padding: 0 4px;
        }
        /* Saat və Vidjetlər */
        .main-clock-section {
            text-align: center;
            margin-top: 10px;
        }
        .date {
            font-size: 12px;
            color: #b5cb99;
            margin-bottom: 2px;
        }
        .time {
            font-size: 52px;
            font-weight: bold;
            color: #f0f7ec;
            line-height: 1;
        }
        .sub-text {
            font-size: 10px;
            color: #b5cb99;
            margin-top: 4px;
        }
        /* Vidjetlər Qutusu */
        .widgets {
            display: flex;
            gap: 10px;
        }
        .widget {
            flex: 1;
            background: #d0e7d2;
            border-radius: 18px;
            padding: 12px;
            font-size: 10px;
        }
        .widget-title {
            font-size: 8px;
            color: #4a6b5d;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .widget-big {
            font-size: 20px;
            font-weight: bold;
            color: #1b211a;
        }
        /* Tətbiq İkonları Gridi */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 0 4px;
        }
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .app-item:active {
            transform: scale(0.92);
        }
        .app-icon {
            width: 44px;
            height: 44px;
            background: #b5cb99;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .app-name {
            font-size: 9px;
            color: #d0e7d2;
            margin-top: 4px;
        }
        /* Ən Alt Dock Paneli */
        .dock {
            background: #d0e7d2;
            border-radius: 20px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dock-icon {
            width: 32px;
            height: 32px;
            background: #b5cb99;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }
        /* Tətbiq açılarkən çıxan səhifə (Modal) */
        #app-window {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0e1e17;
            display: none;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #d0e7d2;
            font-size: 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid #2d4a3e;
            padding-bottom: 10px;
        }
        .back-btn {
            background: #b5cb99;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #1b211a;
        }
        .app-content {
            flex: 1;
            color: #d0e7d2;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="phone">
        <!-- Status Bar -->
        <div class="status-bar">
            <span>21:16</span>
            <span>5G 🔋 86%</span>
        </div>

        <!-- Əsas Saat Bölməsi -->
        <div class="main-clock-section">
            <div class="date">13 Sentyabr, Bazar</div>
            <div class="time">21:16</div>
            <div class="sub-text">Bugün, sana ait.</div>
        </div>

        <!-- Vidjetlər -->
        <div class="widgets">
            <div class="widget">
                <div class="widget-title">BİR NEFES AL</div>
                <div class="widget-big">02:00</div>
                <div style="font-size: 8px; color: #557062;">Odaklanma</div>
            </div>
            <div class="widget">
                <div class="widget-title">FREKANS</div>
                <div class="widget-big" style="font-size: 16px; margin-top: 4px;">Yavaşla.</div>
                <div style="font-size: 8px; color: #557062;">3 səs paketi</div>
            </div>
        </div>

        <!-- Tətbiqlər (1-ci Sətir) -->
        <div class="app-grid">
            <a class="app-item" href="https://wa.me" target="_blank">
                <div class="app-icon">💬</div>
                <div class="app-name">WhatsApp</div>
            </a>
            <a class="app-item" href="https://instagram.com" target="_blank">
                <div class="app-icon">📸</div>
                <div class="app-name">Instagram</div>
            </a>
            <a class="app-item" href="https://youtube.com" target="_blank">
                <div class="app-icon">▶️</div>
                <div class="app-name">YouTube</div>
            </a>
            <a class="app-item" href="https://spotify.com" target="_blank">
                <div class="app-icon">🎵</div>
                <div class="app-name">Spotify</div>
            </a>
        </div>

        <!-- Tətbiqlər (2-ci Sətir) -->
        <div class="app-grid">
            <a class="app-item" href="https://supercell.com" target="_blank">
                <div class="app-icon">🎮</div>
                <div class="app-name">Brawl</div>
            </a>
            <a class="app-item" onclick="openApp('Subway Surfers', 'Qaçış oyunu yüklənir...')">
                <div class="app-icon">🛹</div>
                <div class="app-name">Subway</div>
            </a>
            <a class="app-item" onclick="openApp('Snake Game', 'İlan oyunu işə düşür...')">
                <div class="app-icon">🐍</div>
                <div class="app-name">Snake</div>
            </a>
            <a class="app-item" onclick="openApp('Notlar', 'Səhifə boşdur. Yeni qeyd yazın.')">
                <div class="app-icon">📝</div>
                <div class="app-name">Notlar</div>
            </a>
        </div>

        <!-- Ən Alt Dock Paneli -->
        <div class="dock">
            <a class="dock-icon" href="https://photos.google.com" target="_blank">📷</a>
            <a class="dock-icon" onclick="openApp('Qalereya', 'Bütün şəkillər buradadır.')">🖼️</a>
            <a class="dock-icon" onclick="openApp('Saat & Fəaliyyət', 'Siqnal və taymerlər.')">⏰</a>
            <a class="dock-icon" onclick="openApp('Ayarlar', 'Matudroid sistem ayarları.')">⚙️</a>
        </div>

        <!-- Tətbiq daxili pəncərə (Simulyasiya üçün) -->
        <div id="app-window">
            <div class="app-header">
                <span id="app-title">Tətbiq</span>
                <button class="back-btn" onclick="closeApp()">Bağla</button>
            </div>
            <div class="app-content" id="app-body">
                Məzmun...
            </div>
        </div>
    </div>

    <script>
        function openApp(name, content) {
            document.getElementById('app-title').innerText = name;
            document.getElementById('app-body').innerText = content;
            document.getElementById('app-window').style.display = 'flex';
        }

        function closeApp() {
            document.getElementById('app-window').style.display = 'none';
        }
    </script>

</body>
        </html>
